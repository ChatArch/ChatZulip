[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatZulip"
dynamic = ["version"]
description = "ChatZulip: ChatArch Zulip integration package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0,<9.0", "chatstyle>=0.1.0,<0.2.0", "chatenv>=0.2.2,<0.3.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatzulip", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatZulip"
Repository = "https://github.com/ChatArch/ChatZulip"
Documentation = "https://arch.gh.wzhecnu.cn/ChatZulip/"

[project.scripts]
chatzulip = "chatzulip.cli:main"

[project.entry-points."chatenv.configs"]
zulip = "chatzulip.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.4.0", "mkdocs-material>=9.0.0", "mkdocs-static-i18n>=1.2.0", "mike>=2.0.0"]

[tool.setuptools.dynamic]
version = {attr = "chatzulip.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
